<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Planet Jumping — Ubernatural</title>
<meta name="description" content="Planet Jumping — an immersive space portal experience by jimmiy.">
<link rel="icon" href="https://d2ol7oe51mr4n9.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/eb7e0f53-50cd-4af5-abc4-8b9a52cdc01b.svg">
<style>
@font-face{font-family:"SF Pro";font-weight:400;font-style:normal;font-display:swap;src:local("SF Pro Text"),local("SF Pro Display"),local("SFProText-Regular"),local("SF Pro")}
@font-face{font-family:"SF Pro";font-weight:700;font-style:normal;font-display:swap;src:local("SF Pro Text Bold"),local("SF Pro Display Bold"),local("SFProText-Bold"),local("SF Pro Bold")}
@font-face{font-family:"SF Pro Thin";font-weight:100;font-style:normal;font-display:swap;src:local("SF Pro Display Thin"),local("SFProDisplay-Thin"),local("SF Pro Thin")}
@font-face{font-family:"Aalto";font-weight:400;font-style:normal;font-display:swap;src:local("Aalto"),local("Aalto Regular"),local("Aalto-Regular")}
:root{font-family:'SF Pro',Arial,sans-serif;color:#fff;background:#090807;font-synthesis:none}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden}
.experience{position:relative;width:100%;height:100%;min-height:540px;overflow:hidden;background:#0a0908}
.backgrounds,.background,.shade,.transition-layer,.transition-layer video{position:absolute;inset:0;width:100%;height:100%}
.background{object-fit:cover;opacity:0;transition:opacity .8s ease}
.background.is-visible{opacity:1}
.shade{z-index:1;background:linear-gradient(to bottom,transparent 52%,rgba(0,0,0,.88) 100%);pointer-events:none}
.chrome{position:absolute;z-index:4;transition:opacity .45s ease,filter .45s ease}
.experience.is-transitioning .chrome{opacity:0;filter:blur(8px);pointer-events:none}

/* HEADER */
.header{left:clamp(18px,1.95vw,28px);right:clamp(18px,1.95vw,28px);top:clamp(18px,3.1vh,28px);display:flex;justify-content:space-between;align-items:center}
.header-actions{margin-left:auto;display:flex;align-items:center;gap:8px}
.nav{display:flex;align-items:center;height:42px;padding:4px 5px;border:1px solid rgba(255,255,255,.45);background:rgba(255,255,255,.1);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border-radius:999px}
.nav a{color:#fff;text-decoration:none;padding:8px 19px;border-radius:999px;line-height:1;font-size:16px}
.nav a.active{background:#fff;color:#000}
.menu{height:42px;padding:0 20px;border:0;border-radius:999px;background:#fff;color:#000;cursor:pointer;font:inherit;font-size:16px}

/* SIDEBAR */
.planet-list{left:clamp(18px,1.95vw,28px);top:50%;transform:translateY(-43%);display:flex;flex-direction:column;gap:6px;font-size:16px}
.planet-item{display:flex;align-items:center;min-height:20px}
.planet-item.active{font-size:18px;font-weight:700;gap:8px}
.planet-item.active:before{content:'';width:16px;height:16px;border-radius:50%;background:#fff}

/* PORTAL */
.portal-wrap{left:50%;top:50%;width:min(320px,31vw);transform:translate(-50%,-54%);perspective:none}
.portal-heading{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;font-size:16px;opacity:0}
.portal-heading strong{font-size:18px;margin-left:8px}
.portal{position:relative;display:block;width:100%;aspect-ratio:320/350;padding:0;overflow:visible;border:0;border-radius:90px;background:transparent;cursor:pointer;box-shadow:none;transform:none!important;color:inherit;-webkit-tap-highlight-color:transparent}
.portal:focus-visible{outline:1px solid rgba(255,255,255,.6);outline-offset:6px}
.portal video,.portal img{visibility:hidden;position:absolute;width:1px;height:1px;pointer-events:none}
.portal-canvas{position:fixed;inset:0;z-index:3;width:100%;height:100%;pointer-events:none}

/* CONTENT */
.planet-content{left:clamp(28px,4vw,58px);right:clamp(28px,3vw,44px);bottom:clamp(24px,3vh,30px);display:flex;justify-content:space-between;align-items:flex-end;gap:40px}
.planet-content h1{font-family:Aalto,'Arial Narrow','Liberation Sans Narrow','Roboto Condensed',sans-serif;font-stretch:condensed;font-size:clamp(128px,21.8vw,314px);font-weight:400;line-height:.72;margin:0 0 -.04em;letter-spacing:0;transform:translateX(-32px);opacity:0}
.planet-content dl{width:min(447px,34vw);margin:0;font-size:16px;flex:none}
.planet-content h1{white-space:nowrap}
.fact{display:grid;grid-template-columns:138px 1fr;gap:18px;padding:8px 0;border-bottom:1px solid rgba(255,255,255,.48);opacity:0}
.fact:last-child{border-bottom:0}
.fact dt{font-weight:700}
.fact dd{margin:0}

/* MISC */
.transition-layer{display:none}
.scene-canvas{display:none}
.loading{position:absolute;z-index:12;left:50%;bottom:30px;transform:translateX(-50%);opacity:0;font-size:12px;letter-spacing:.14em;text-transform:uppercase;transition:opacity .2s;pointer-events:none}
.experience.is-loading .loading{opacity:.8}
.experience.is-transitioning .header,.experience.is-transitioning .planet-list{opacity:1;filter:none;pointer-events:auto}
.experience.is-transitioning .shade{opacity:1}
.experience.is-committing .background{transition:none!important}

/* PRELOADER */
.preloader{position:absolute;inset:0;z-index:20;background:#000;overflow:hidden}
.preloader video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.preloader-shade{position:absolute;inset:auto 0 0;height:35%;background:linear-gradient(to bottom,transparent,#000);transition:opacity .8s ease}
.preloader.is-background{z-index:0}
.preloader.is-background .preloader-shade{opacity:0}
.floating-logo{position:fixed;z-index:22;left:50%;top:50%;width:59px;height:58px;transform:translate(-50%,-50%);will-change:left,top,width,height,transform;
  transition:left 2s cubic-bezier(.16,1,.3,1),top 2s cubic-bezier(.16,1,.3,1),width 2s cubic-bezier(.16,1,.3,1),height 2s cubic-bezier(.16,1,.3,1),transform 2s cubic-bezier(.16,1,.3,1);pointer-events:none}
.floating-logo.is-docked{left:clamp(18px,1.95vw,28px);top:clamp(18px,3.1vh,28px);width:37px;height:36px;transform:none}
.floating-logo.is-settled{z-index:5}
.preloader-count{position:fixed;z-index:22;left:50%;bottom:clamp(22px,3.1vh,28px);display:flex;align-items:flex-end;gap:4px;transform:translateX(-50%);font-family:'SF Pro',Arial,sans-serif;line-height:1;pointer-events:none}
.preloader-count>span:first-child{font-family:'SF Pro Thin','SF Pro',Arial,sans-serif;font-size:64px;font-weight:100;font-variant-numeric:tabular-nums}
.preloader-count .percent{font-size:24px;padding-bottom:4px}
.preloader-count.is-leaving{animation:preload-count-out .75s cubic-bezier(.22,1,.36,1) both}
@keyframes preload-count-out{to{opacity:0;filter:blur(7px);transform:translate(-50%,-34px)}}
body:not(.preload-complete) .custom-cursor{opacity:0!important}

/* CUSTOM CURSOR */
html,body,button,a,.portal{cursor:none!important}
.custom-cursor{display:block;position:fixed;left:0;top:0;z-index:100;width:1px;height:1px;pointer-events:none;opacity:0;transition:opacity .2s ease}
.custom-cursor.is-visible{opacity:1}
.cursor-dot,.cursor-orbit{position:absolute;left:0;top:0;border-radius:50%;transform:translate(-50%,-50%)}
.cursor-dot{width:12px;height:12px;background:#fff}
.cursor-orbit{width:36px;height:36px;border:1px solid #fff;background:rgba(255,255,255,.4);transition:transform .3s cubic-bezier(.22,1,.36,1)}
.custom-cursor.is-enter .cursor-orbit{transform:translate(-50%,-50%) scale(1.16)}
.cursor-label{position:absolute;top:26px;left:0;transform:translateX(-50%) translateY(-4px);font:16px/1.2 'SF Pro',Arial,sans-serif;white-space:nowrap;opacity:0;transition:opacity .2s ease,transform .3s cubic-bezier(.22,1,.36,1)}
.custom-cursor.is-enter .cursor-label{opacity:1;transform:translateX(-50%) translateY(0)}

/* ENTRANCE / SWITCH */
body:not(.intro-ready) .header,.planet-list,.planet-content h1,.planet-content .fact{opacity:0}
.intro-ready .header{animation:reveal-down .9s cubic-bezier(.22,1,.36,1) .1s both}
.intro-ready .planet-list{animation:reveal-side .9s cubic-bezier(.22,1,.36,1) .65s both}
.content-revealing h1{animation:title-rise 1.05s cubic-bezier(.16,1,.3,1) both}
.content-revealing .fact{animation:fact-rise .72s cubic-bezier(.22,1,.36,1) both}
.content-revealing .fact:nth-child(1){animation-delay:.52s}
.content-revealing .fact:nth-child(2){animation-delay:.68s}
.content-revealing .fact:nth-child(3){animation-delay:.84s}
.content-revealing .fact:nth-child(4){animation-delay:1s}
.mask-revealing .portal-heading{animation:portal-caption .85s cubic-bezier(.22,1,.36,1) both}
.planet-list.is-switching .planet-item{animation:menu-row .58s cubic-bezier(.22,1,.36,1) both}
.planet-list.is-switching .planet-item:nth-child(1){animation-delay:.02s}
.planet-list.is-switching .planet-item:nth-child(2){animation-delay:.05s}
.planet-list.is-switching .planet-item:nth-child(3){animation-delay:.08s}
.planet-list.is-switching .planet-item:nth-child(4){animation-delay:.11s}
.planet-list.is-switching .planet-item:nth-child(5){animation-delay:.14s}
.planet-list.is-switching .planet-item:nth-child(6){animation-delay:.17s}
.planet-list.is-switching .planet-item:nth-child(7){animation-delay:.2s}
.planet-list.is-switching .planet-item:nth-child(8){animation-delay:.23s}
.planet-list.is-switching .planet-item.active:before{animation:active-dot .55s cubic-bezier(.22,1,.36,1) .18s both}
@keyframes reveal-down{from{opacity:0;filter:blur(8px);transform:translateY(-18px)}to{opacity:1;filter:blur(0);transform:translateY(0)}}
@keyframes reveal-side{from{opacity:0;filter:blur(8px);transform:translate(-20px,-43%)}to{opacity:1;filter:blur(0);transform:translate(0,-43%)}}
@keyframes title-rise{from{opacity:0;filter:blur(12px);transform:translate(-32px,42px)}to{opacity:1;filter:blur(0);transform:translate(-32px,0)}}
@keyframes fact-rise{from{opacity:0;filter:blur(7px);transform:translateY(18px)}to{opacity:1;filter:blur(0);transform:translateY(0)}}
@keyframes portal-caption{from{opacity:0;filter:blur(7px);transform:translateY(22px)}to{opacity:1;filter:blur(0);transform:translateY(0)}}
@keyframes menu-row{from{opacity:.35;transform:translateX(-8px)}to{opacity:1;transform:translateX(0)}}
@keyframes active-dot{from{opacity:0;transform:scale(0)}to{opacity:1;transform:scale(1)}}

/* RESPONSIVE */
@media(max-width:900px){
  .nav{display:none}
  .portal-wrap{width:min(300px,48vw)}
  .planet-content h1{font-size:clamp(105px,24vw,190px)}
  .planet-content dl{width:43vw}
  .fact{grid-template-columns:110px 1fr}
  .planet-list{font-size:14px}
  .planet-item.active{font-size:16px}
}
@media(max-width:640px){
  .experience{min-height:600px}
  .planet-list{display:none}
  .portal-wrap{top:44%;width:min(260px,66vw)}
  .planet-content{left:18px;right:18px;bottom:18px;display:block}
  .planet-content h1{font-size:clamp(98px,30vw,160px);margin-bottom:20px}
  .planet-content dl{width:100%;font-size:13px}
  .fact{grid-template-columns:92px 1fr;padding:5px 0}
  .portal-heading{font-size:14px}
  .portal-heading strong{font-size:16px}
  .menu{height:38px}
  .portal{border-radius:70px}
}
@media(hover:none),(pointer:coarse){.custom-cursor{display:none}}
@media(prefers-reduced-motion:reduce){*{transition-duration:.01ms!important}.portal{transform:none!important}}
</style>

<script>
(() => {
'use strict';
const BASE = 'https://d2ol7oe51mr4n9.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P';
const TO_EARTH = BASE + '/fc3ded42-e845-41f3-a830-5cab512d79cd.mp4';
const TO_VENUS = BASE + '/b30f64d9-1637-477a-83df-d0fc6461a422.mp4';
const MERCURY  = BASE + '/d6fb8b6b-c15e-4aaa-9cf7-45bbb5e33372.jpg';
const PI = Math.PI;

const planets = ['Mercury','Venus','Earth','Mars','Jupiter','Saturn','Uranus','Neptune'];
const states = {
  mars:  { name:'Mars', next:'Earth', number:'[03]', portal:TO_EARTH, background:'mars-background',
    facts:[['Distance:','About 228 million km (1.5 astronomical units).'],
           ['Year:','One Martian year is equal to 687 Earth days.'],
           ['Temperature:','Around -60 °C, dropping to -125 °C at the poles in winter.'],
           ['Atmosphere:','Very thin, consisting of 95% carbon dioxide, with frequent dust storms.']] },
  earth: { name:'Earth', next:'Venus', number:'[02]', portal:TO_VENUS, background:'earth-background',
    facts:[['Distance:','149.6 million km from the Sun.'],
           ['Year:','365.25 Earth days.'],
           ['Temperature:','Average surface temperature around 15 °C.'],
           ['Atmosphere:','Mostly nitrogen and oxygen, supporting life and liquid water.']] },
  venus: { name:'Venus', next:'Mercury', number:'[06]', image:MERCURY, background:'venus-background',
    facts:[['Distance:','108.2 million km from the Sun.'],
           ['Year:','225 Earth days.'],
           ['Temperature:','Around 465 °C — the hottest planet in the Solar System.'],
           ['Atmosphere:','Extremely dense, mostly carbon dioxide, with clouds of sulfuric acid.']] }
};

const $ = id => document.getElementById(id);
const experience = document.querySelector('.experience');
const planetList = document.querySelector('.planet-list');
const titleEl = $('planet-title'), factsEl = $('facts');
const nextName = $('next-name'), nextNumber = $('next-number');
const portal = $('portal'), portalVideo = $('portal-video'), portalImage = $('portal-image');
const portalCanvas = $('portal-canvas'), ctx = portalCanvas.getContext('2d');
const sceneCanvas = $('scene-canvas'), sctx = sceneCanvas.getContext('2d');
const transitionVideo = $('transition-video');
const preloader = $('preloader'), preVideo = $('preloader-video');
const preCount = $('preloader-count'), preValue = $('preloader-value');
const logo = $('floating-logo');
const cursor = document.querySelector('.custom-cursor');

let current = 'mars';
let firstRender = true;
let busy = false;
let rotX = 0, rotY = 0, targetX = 0, targetY = 0;
let expansion = 0, maskScale = 0, canvasOpacity = 1;
let transitionActive = false;
let frozen = false;
let dpr = 1;

const ease = t => t < .5 ? 4*t*t*t : 1 - Math.pow(-2*t + 2, 3) / 2;
const raf = () => new Promise(r => requestAnimationFrame(r));
const wait = ms => new Promise(r => setTimeout(r, ms));
const retrigger = (el, cls) => { el.classList.remove(cls); void el.offsetWidth; el.classList.add(cls); };

function animateValue(setter, duration) {
  return new Promise(resolve => {
    const t0 = performance.now();
    const step = now => {
      const t = Math.min(1, (now - t0) / duration);
      setter(ease(t));
      if (t < 1) requestAnimationFrame(step); else resolve();
    };
    requestAnimationFrame(step);
  });
}

/* ---------- render ---------- */
function render() {
  const s = states[current];
  experience.dataset.planet = current;
  titleEl.textContent = s.name.toUpperCase();
  nextName.textContent = s.next;
  nextNumber.textContent = s.number;
  portal.setAttribute('aria-label', `Travel to ${s.next}`);
  factsEl.innerHTML = s.facts.map(([k, v]) => `<div class="fact"><dt>${k}</dt><dd>${v}</dd></div>`).join('');
  planetList.innerHTML = planets.map(p => `<span class="planet-item${p === s.name ? ' active' : ''}">${p}</span>`).join('');
  fitTitle();
  if (!firstRender) retrigger(planetList, 'is-switching');
  firstRender = false;
  document.querySelectorAll('.background').forEach(v => v.classList.toggle('is-visible', v.id === s.background));
  if (s.image) {
    portalImage.style.display = '';
    portalVideo.style.display = 'none';
    portalVideo.pause();
  } else {
    portalImage.style.display = 'none';
    portalVideo.style.display = '';
    if (portalVideo.getAttribute('src') !== s.portal) { portalVideo.src = s.portal; portalVideo.load(); }
    playPortalLoop();
  }
}

function playPortalLoop() {
  portalVideo.loop = true;
  const p = portalVideo.play();
  if (p && p.catch) p.catch(() => {});
}

function currentMedia() { return states[current].image ? portalImage : portalVideo; }

function mediaReady(media, timeout = 5000) {
  return new Promise(resolve => {
    if (media instanceof HTMLImageElement ? (media.complete && media.naturalWidth) : media.readyState >= 2) return resolve();
    const done = () => { clearTimeout(timer); ['loadeddata','canplay','load','error'].forEach(e => media.removeEventListener(e, done)); resolve(); };
    const timer = setTimeout(done, timeout);
    ['loadeddata','canplay','load','error'].forEach(e => media.addEventListener(e, done));
  });
}

/* keep the giant title clear of the facts when the condensed face is unavailable */
function fitTitle() {
  titleEl.style.fontSize = '';
  const box = titleEl.parentElement;
  if (getComputedStyle(box).display !== 'flex') {
    const avail = box.clientWidth + 32;
    if (titleEl.scrollWidth > avail) titleEl.style.fontSize = (parseFloat(getComputedStyle(titleEl).fontSize) * avail / titleEl.scrollWidth) + 'px';
    return;
  }
  const avail = box.clientWidth - factsEl.offsetWidth - 40;
  const natural = titleEl.scrollWidth - 32;
  if (natural > avail && avail > 0) titleEl.style.fontSize = (parseFloat(getComputedStyle(titleEl).fontSize) * avail / natural) + 'px';
}

/* ---------- canvas ---------- */
function resizeCanvas() {
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  const W = innerWidth, H = innerHeight;
  portalCanvas.width = Math.round(W * dpr); portalCanvas.height = Math.round(H * dpr);
  portalCanvas.style.width = W + 'px'; portalCanvas.style.height = H + 'px';
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  if (!frozen) {
    sceneCanvas.width = Math.round(W * dpr); sceneCanvas.height = Math.round(H * dpr);
    sceneCanvas.style.width = W + 'px'; sceneCanvas.style.height = H + 'px';
    sctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
}

function mediaSize(m) {
  return [m.videoWidth || m.naturalWidth || 0, m.videoHeight || m.naturalHeight || 0];
}
function drawCover(c, media) {
  const [mw, mh] = mediaSize(media);
  if (!mw || !mh) return;
  if (media instanceof HTMLVideoElement && media.readyState < 2) return;
  const W = innerWidth, H = innerHeight;
  const scale = Math.max(W / mw, H / mh);
  const w = mw * scale, h = mh * scale;
  try { c.drawImage(media, (W - w) / 2, (H - h) / 2, w, h); } catch (e) {}
}
function drawShade(c) {
  const W = innerWidth, H = innerHeight;
  const g = c.createLinearGradient(0, H * .52, 0, H);
  g.addColorStop(0, 'rgba(0,0,0,0)');
  g.addColorStop(1, 'rgba(0,0,0,.88)');
  c.fillStyle = g;
  c.fillRect(0, H * .52, W, H * .48);
}

function roundedRectPoints(w, h, r) {
  r = Math.max(0, Math.min(r, w / 2, h / 2));
  const arcs = [
    [ w/2 - r, -h/2 + r, -PI/2, 0 ],
    [ w/2 - r,  h/2 - r, 0, PI/2 ],
    [-w/2 + r,  h/2 - r, PI/2, PI ],
    [-w/2 + r, -h/2 + r, PI, PI * 1.5 ]
  ];
  const pts = [];
  for (const [ax, ay, a0, a1] of arcs) {
    for (let i = 0; i <= 10; i++) {
      const a = a0 + (a1 - a0) * i / 10;
      pts.push([ax + Math.cos(a) * r, ay + Math.sin(a) * r]);
    }
  }
  return pts;
}
function project([x, y], cx, cy, rx, ry) {
  const ax = rx * PI / 180, ay = ry * PI / 180;
  const xx = x * Math.cos(ay);
  const yy = y * Math.cos(ax);
  const z = x * Math.sin(ay) - y * Math.sin(ax);
  const p = 850 / (850 + z);
  return [cx + xx * p, cy + yy * p];
}

let lastFrame = performance.now();
function draw(now) {
  const dt = Math.min(40, Math.max(0, now - lastFrame));
  lastFrame = now;
  const k = Math.min(1, dt * .009);
  rotX += (targetX - rotX) * k;
  rotY += (targetY - rotY) * k;

  const W = innerWidth, H = innerHeight;
  ctx.clearRect(0, 0, W, H);
  if (frozen) { ctx.drawImage(sceneCanvas, 0, 0, W, H); drawShade(ctx); }

  const rect = portal.getBoundingClientRect();
  const e = expansion;
  const rcx = rect.left + rect.width / 2, rcy = rect.top + rect.height / 2;
  const cx = rcx + (W / 2 - rcx) * e;
  const cy = rcy + (H / 2 - rcy) * e;
  const baseW = rect.width + (W - rect.width) * e;
  const baseH = rect.height + (H - rect.height) * e;
  const scale = e ? 1 : maskScale;
  const w = baseW * scale, h = baseH * scale;
  const radius = parseFloat(getComputedStyle(portal).borderTopLeftRadius) || 90;
  const r = radius * (1 - e) * scale;
  const rx = rotX * (1 - e), ry = rotY * (1 - e);

  if (w > 1 && h > 1) {
    const pts = roundedRectPoints(w, h, r).map(p => project(p, cx, cy, rx, ry));
    ctx.save();
    ctx.globalAlpha = canvasOpacity;
    ctx.beginPath();
    pts.forEach(([x, y], i) => i ? ctx.lineTo(x, y) : ctx.moveTo(x, y));
    ctx.closePath();
    ctx.clip();
    ctx.fillStyle = '#030303';
    ctx.fillRect(0, 0, W, H);
    drawCover(ctx, transitionActive ? transitionVideo : (states[current].image ? portalImage : portalVideo));
    if (transitionActive) drawShade(ctx);
    ctx.restore();
  }
  requestAnimationFrame(draw);
}

/* ---------- pointer tilt ---------- */
window.addEventListener('pointermove', ev => {
  if (ev.pointerType && ev.pointerType !== 'mouse' && ev.pointerType !== 'pen') return;
  if (busy) return;
  targetY = (ev.clientX / innerWidth - .5) * 37.4;
  targetX = (ev.clientY / innerHeight - .5) * -33;
});
document.documentElement.addEventListener('pointerleave', () => { targetX = 0; targetY = 0; });

/* ---------- reveals ---------- */
function revealMask() {
  retrigger(experience, 'mask-revealing');
  maskScale = 0;
  return animateValue(v => { maskScale = v; }, 1050);
}
function revealPlanetContent() { retrigger(experience, 'content-revealing'); }

async function startExperience() {
  await mediaReady(currentMedia());
  await revealMask();
  document.body.classList.add('intro-ready');
  setTimeout(revealPlanetContent, 850);
}

/* ---------- travel ---------- */
function once(el, evs, timeout) {
  return new Promise(resolve => {
    let timer;
    const done = () => { clearTimeout(timer); evs.forEach(e => el.removeEventListener(e, done)); resolve(); };
    evs.forEach(e => el.addEventListener(e, done));
    if (timeout) timer = setTimeout(done, timeout);
  });
}

async function travel() {
  if (busy || current === 'venus') return;
  busy = true; targetX = 0; targetY = 0;
  const next = current === 'mars' ? 'earth' : 'venus';
  try {
    transitionVideo.src = states[current].portal;
    transitionVideo.load();
    experience.classList.add('is-loading');
    await once(transitionVideo, ['canplaythrough', 'error'], 1600);
    experience.classList.remove('is-loading', 'content-revealing', 'mask-revealing');
    experience.classList.add('is-transitioning');
    transitionVideo.currentTime = 0;
    transitionVideo.playbackRate = 1.3;
    canvasOpacity = 1;
    transitionActive = true;
    const dur = isFinite(transitionVideo.duration) && transitionVideo.duration > 0 ? transitionVideo.duration : 8;
    const ended = once(transitionVideo, ['ended', 'error'], dur / 1.3 * 1000 + 4000);
    await transitionVideo.play();
    await animateValue(v => { expansion = v; }, 1100);
    await ended;

    // freeze final frame
    frozen = false;
    resizeCanvas();
    sctx.clearRect(0, 0, innerWidth, innerHeight);
    drawCover(sctx, transitionVideo);
    frozen = true;

    current = next;
    experience.classList.add('is-committing');
    render();
    await raf(); await raf();
    transitionActive = false; expansion = 0; maskScale = 0; canvasOpacity = 1;
    experience.classList.remove('is-transitioning', 'is-committing');
    await mediaReady(currentMedia(), 2500);
    const maskReveal = revealMask();
    setTimeout(revealPlanetContent, 100);
    await maskReveal;
    setTimeout(() => {
      transitionVideo.removeAttribute('src');
      transitionVideo.load();
      busy = false;
    }, 450);
  } catch (err) {
    transitionActive = false; expansion = 0; maskScale = 1; canvasOpacity = 1;
    experience.classList.remove('is-loading', 'is-transitioning', 'is-committing');
    busy = false;
  }
}
portal.addEventListener('click', travel);

/* ---------- custom cursor ---------- */
let curX = innerWidth / 2, curY = innerHeight / 2, ptrX = curX, ptrY = curY, cursorSeen = false;
window.addEventListener('pointermove', ev => {
  if (ev.pointerType && ev.pointerType !== 'mouse' && ev.pointerType !== 'pen') return;
  ptrX = ev.clientX; ptrY = ev.clientY;
  if (!cursorSeen) { cursorSeen = true; curX = ptrX; curY = ptrY; }
  cursor.classList.add('is-visible');
});
document.addEventListener('mouseleave', () => cursor.classList.remove('is-visible'));
document.documentElement.addEventListener('mouseleave', () => cursor.classList.remove('is-visible'));
portal.addEventListener('pointerenter', () => cursor.classList.add('is-enter'));
portal.addEventListener('pointerleave', () => cursor.classList.remove('is-enter'));
function cursorLoop() {
  curX += (ptrX - curX) * .2;
  curY += (ptrY - curY) * .2;
  cursor.style.transform = `translate3d(${curX}px,${curY}px,0)`;
  requestAnimationFrame(cursorLoop);
}

/* ---------- preloader ---------- */
function runPreloader() {
  const v = preVideo;
  let finished = false, tickId = 0;
  const finish = () => {
    if (finished) return;
    finished = true;
    cancelAnimationFrame(tickId);
    preValue.textContent = '100';
    preCount.classList.add('is-leaving');
    logo.classList.add('is-docked');
    preloader.classList.add('is-background');
    document.body.classList.add('preload-complete');
    startExperience();
    setTimeout(() => preCount.remove(), 750);
    setTimeout(() => logo.classList.add('is-settled'), 2000);
  };
  const tick = () => {
    if (finished) return;
    if (v.duration) preValue.textContent = String(Math.min(100, Math.round(v.currentTime / v.duration * 100)));
    tickId = requestAnimationFrame(tick);
  };
  const start = () => {
    try { v.playbackRate = Math.min(16, Math.max(.25, v.duration / 3)); } catch (e) {}
    const p = v.play();
    tickId = requestAnimationFrame(tick);
    if (p && p.catch) p.catch(finish);
  };
  v.addEventListener('ended', finish);
  v.addEventListener('error', finish);
  if (v.readyState >= 1) start(); else v.addEventListener('loadedmetadata', start, { once: true });
  setTimeout(finish, 12000); // safety net for very slow networks
}

/* ---------- boot ---------- */
window.addEventListener('resize', () => { resizeCanvas(); fitTitle(); });
if (document.fonts && document.fonts.ready) document.fonts.ready.then(fitTitle);
document.querySelectorAll('.background').forEach(v => { v.pause(); try { v.currentTime = 0; } catch (e) {} });
resizeCanvas();
render();
requestAnimationFrame(draw);
requestAnimationFrame(cursorLoop);
runPreloader();
})();
</script>
</body>
</html>
